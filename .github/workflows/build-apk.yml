<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIGABELAS — Login</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="brand-mark">13</div>
      <div class="brand">TIGABELAS</div>
      <p class="subtitle">Laundry Outlet Management</p>

      <div id="loading" class="status">Memeriksa sesi...</div>

      <div id="loginView" class="hidden">
        <button id="googleLogin" class="google-btn" type="button">
          <span class="google-icon">G</span>
          <span>Masuk dengan Google</span>
        </button>
        <p class="hint">Akses TIGABELAS khusus untuk pengguna yang terdaftar.</p>
      </div>

      <div id="appView" class="hidden">
        <div class="welcome">
          <div class="avatar-wrap">
            <img id="avatar" alt="Foto profil" class="avatar">
          </div>
          <div>
            <h2 id="userName">Pengguna</h2>
            <p id="userEmail"></p>
          </div>
        </div>

        <div class="role-box">
          <span>ROLE</span>
          <strong id="userRole">Memuat...</strong>
        </div>

        <div class="dashboard-grid">
          <div><span>Omzet Hari Ini</span><strong>Rp 0</strong></div>
          <div><span>Kas Hari Ini</span><strong>Rp 0</strong></div>
          <div><span>Belum Lunas</span><strong>Rp 0</strong></div>
          <div><span>Order Aktif</span><strong>0</strong></div>
        </div>

        <button id="logout" class="logout-btn" type="button">Keluar</button>
      </div>

      <div id="errorView" class="error hidden"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
